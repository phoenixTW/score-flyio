apiVersion: score.dev/v1b1
metadata:
  name: demo-app
  fly:
    ingress:
      type: public
      hostname: demo-app.example.internal
    region: ams
    processes:
      web:
        machine_group: app
        vm:
          cpus: 1
          memory_mb: 512
        scale:
          min: 2
          max: 4
        http_service:
          internal_port: 8080
          ports:
            - port: 443
              handlers:
                - http
        checks:
          ready:
            type: http
            port: 8080
            method: get
            path: /readyz
            interval_seconds: 10
            timeout_seconds: 5
      tunnel:
        machine_group: app
        vm:
          cpus: 1
          memory_mb: 512
        scale:
          min: 2
          max: 4
      worker:
        vm:
          cpus: 2
          memory_mb: 1024
        scale:
          min: 1
          max: 1
containers:
  web:
    image: "registry.example/demo-app/web@sha256:\
      1111111111111111111111111111111111111111111111111111111111111111"
  tunnel:
    image: "registry.example/demo-app/tunnel@sha256:\
      2222222222222222222222222222222222222222222222222222222222222222"
  worker:
    image: "registry.example/demo-app/worker@sha256:\
      3333333333333333333333333333333333333333333333333333333333333333"
    variables:
      QUEUE_URL: amqp://queue.internal
