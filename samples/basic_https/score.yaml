apiVersion: score.dev/v1b1
metadata:
  name: example
  annotations:
    score-flyio.phoenixtw.github.com/service-web-handlers: "tls,http"
    score-flyio.phoenixtw.github.com/service-web-auto-stop: "stop"
    score-flyio.phoenixtw.github.com/service-web-min-running: "1"
    score-flyio.phoenixtw.github.com/service-web-http-options: >-
      {"h2_backend":true}
    score-flyio.phoenixtw.github.com/service-web-concurrency: >-
      {"type":"requests","hard_limit":20,"soft_limit":10}
containers:
  main:
    image: ghcr.io/astromechza/demo-app:latest
service:
  ports:
    web:
      port: 443
      targetPort: 8080
